<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 文化 - TGAI Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-white: rgba(255, 255, 255, 0.1);
            --tg-cyan: #00F2FF;
            --tg-emerald: #00F5A0;
            --tg-bg: #010204;
        }

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background: radial-gradient(circle at 50% 0%, rgba(15, 23, 42, 0.4) 0%, #111827 100%);
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background-color: #111827;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .safe-area-top { padding-top: env(safe-area-inset-top); }

        /* 玻璃擬態卡片 */
        .neu-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }

        /* Banner 樣式 */
        .banner-card {
            position: relative;
            height: 160px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid var(--border-white);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .banner-card::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--tg-cyan), transparent, var(--tg-emerald), transparent);
            animation: rotate 10s linear infinite;
            opacity: 0.15;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 分類標籤樣式 */
        .category-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .category-tab.active {
            color: var(--tg-cyan);
        }
        .category-tab.active .tab-indicator {
            width: 24px;
            height: 3px;
            background: var(--tg-cyan);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--tg-cyan);
        }

        /* 內容卡片樣式 */
        .content-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .content-card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }
        .card-image {
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 底部導航欄 */
        .bottom-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 400px;
            height: 64px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .nav-item.active {
            color: var(--tg-cyan);
        }
        .nav-label { font-weight: 500; }
    </style>
</head>
<body>
    <div class="app-container" data-page="culture-home">

            <!-- 卡片 1 -->

                    </svg>
                </div>

                    <div class="flex items-center gap-3">
                        <span class="px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-500 text-[10px] font-bold uppercase tracking-wider">最佳實踐</span>
                        <span class="text-[12px] text-white/20">2025/01/12</span>
                    </div>
                </div>

            <!-- 卡片 2 -->
            <a href="culture-detail-mobile.html" class="block content-card">
                <div class="card-image">
                    <svg class="w-12 h-12 text-white/5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h14a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <div class="p-5">
                    <h3 class="text-[17px] font-bold text-white/90 leading-snug mb-3">2025 全球 AI 創新大賽：探索智能未來的新邊界</h3>
                    <div class="flex items-center gap-3">
                        <span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-500 text-[10px] font-bold uppercase tracking-wider">AI 賽事</span>

                    </div>

        </main>

        <!-- 底部導航欄 -->
        <nav class="bottom-nav" data-section="bottom-nav">

            <a href="model-home-mobile.html" class="nav-item">

    </div>
