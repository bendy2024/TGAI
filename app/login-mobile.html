<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登錄 | 中華煤氣統一 AI 平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Noto+Sans+HK:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-white: rgba(255, 255, 255, 0.08);
            --tg-cyan: #00F2FF;
            --tg-emerald: #00F5A0;
            --tg-bg: #010204;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --card-radius: 24px;
        }

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background: radial-gradient(circle at 50% 0%, #111827 0%, #010204 100%);
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
            letter-spacing: 0.02em;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background: transparent;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .safe-area-top { padding-top: env(safe-area-inset-top); }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }

        .neu-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--card-radius);
            position: relative;
            overflow: hidden;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--tg-cyan) 0%, var(--tg-emerald) 100%);
            color: #000;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 242, 255, 0.1);
            height: 44px;
        }
        .btn-action:active { transform: scale(0.98); opacity: 0.9; }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            transition: all 0.3s ease;
            outline: none;
            font-size: 15px;
        }
        .input-field:focus {
            border-color: var(--tg-cyan);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1);
        }

        .title-underline {
            position: relative;
            display: inline-block;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
            font-weight: 700;
            padding-bottom: 8px;
        }

        .captcha-box {
            width: 100px;
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-white);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Lang Selector */
        .lang-trigger {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-white);
            border-radius: 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }
        .lang-trigger:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            z-index: 1001;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
    </style>
</head>
<body>
    <div class="app-container flex flex-col items-center justify-center px-6 safe-area-top safe-area-bottom" data-page="login-page">
        <!-- Logo -->
        <div class="mb-10 relative z-10 text-center">
            <div class="text-3xl font-black italic tracking-tighter text-white mb-2">TGAI</div>
            <div class="text-[10px] uppercase tracking-[0.2em] text-white/30 font-medium">Unified AI Platform</div>
        </div>

        <main class="w-full max-w-[380px] relative z-10" data-section="login-form">
            <!-- 登錄卡片 -->
            <div class="neu-card p-8">
                <!-- 標題 -->
                <div class="text-center mb-8">
                    <div class="title-underline">賬戶登錄</div>
                </div>

                <form id="loginForm" class="space-y-6">
                    <!-- 帳號輸入 -->
                    <div class="space-y-2">
                        <label class="text-[11px] uppercase tracking-wider text-white/30 font-bold ml-1">帳戶</label>
                        <input type="text" id="account" placeholder="請輸入帳戶" class="input-field" required>
                    </div>

                    <!-- 密碼輸入 -->
                    <div class="space-y-2">
                        <label class="text-[11px] uppercase tracking-wider text-white/30 font-bold ml-1">密碼</label>
                        <input type="password" id="password" placeholder="請輸入登錄密碼" class="input-field" required>
                    </div>

                    <!-- 圖形驗證碼 -->
                    <div class="space-y-2">
                        <label class="text-[11px] uppercase tracking-wider text-white/30 font-bold ml-1">驗證碼</label>
                        <div class="flex items-center gap-3">
                            <div class="flex-1">
                                <input type="text" id="captcha" placeholder="輸入驗證碼" class="input-field" required>
                            </div>
                            <div class="captcha-box">
                                <span class="text-white/20 italic font-bold tracking-widest">4K2B</span>
                            </div>
                        </div>
                    </div>

                    <!-- 登錄按鈕 -->
                    <button type="submit" class="btn-action w-full mt-4">
                        <span>登錄系統</span>
                    </button>
                </form>

                <!-- 語言切換 -->
                <div class="flex justify-center mt-10">
                    <button type="button" class="lang-trigger" id="langTrigger">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span id="currentLang">繁體中文</span>
                        <svg class="w-3 h-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Language Bottom Sheet -->
    <div class="bottom-sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="langSheet">
        <div class="sheet-handle"></div>
        <h3 class="text-center text-white/50 text-base mb-6">選擇語言 / Select Language</h3>
        <div class="space-y-2">
            <button class="sheet-option selected" data-lang="zh-HK">
                <span>繁體中文</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </button>
            <button class="sheet-option" data-lang="zh-CN">
                <span>简体中文</span>
            </button>
            <button class="sheet-option" data-lang="en">
                <span>English</span>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const langTrigger = document.getElementById('langTrigger');
            const sheetOverlay = document.getElementById('sheetOverlay');
            const langSheet = document.getElementById('langSheet');
            const currentLangText = document.getElementById('currentLang');
            const sheetOptions = document.querySelectorAll('.sheet-option');

            // Toggle Language Sheet
            const toggleSheet = (show) => {
                sheetOverlay.classList.toggle('active', show);
                langSheet.classList.toggle('active', show);
            };

            langTrigger.addEventListener('click', () => toggleSheet(true));
            sheetOverlay.addEventListener('click', () => toggleSheet(false));

            // Select Language
            sheetOptions.forEach(option => {
                option.addEventListener('click', () => {
                    sheetOptions.forEach(opt => opt.classList.remove('selected'));
                    option.classList.add('selected');
                    currentLangText.textContent = option.querySelector('span').textContent;
                    
                    // Add checkmark to selected
                    sheetOptions.forEach(opt => {
                        const icon = opt.querySelector('svg');
                        if (icon) icon.remove();
                    });
                    option.insertAdjacentHTML('beforeend', '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>');
                    
                    setTimeout(() => toggleSheet(false), 200);
                });
            });

            // 登錄模擬
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = loginForm.querySelector('button[type="submit"]');
                
                btn.disabled = true;
                btn.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-black mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>登錄中...</span>
                `;

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            });
        });
    </script>
</body>
</html>
