<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>用戶中心 - TGAI Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-white: rgba(255, 255, 255, 0.08);
            --tg-cyan: #00F2FF;
            --tg-emerald: #00F5A0;
            --tg-bg: #010204;
        }

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background: radial-gradient(circle at 50% 0%, #111827 0%, #010204 100%);
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background: transparent;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        .safe-area-top { padding-top: env(safe-area-inset-top); }

        /* 新版卡片樣式 */
        .neu-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 數值高亮 */
        .stat-value {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 2px;
        }

        .stat-unit {
            font-size: 12px;
            font-weight: normal;
            color: rgba(255,255,255,0.4);
            -webkit-text-fill-color: initial;
        }

        /* 通知點 */
        .dot-indicator {
            width: 6px;
            height: 6px;
            background-color: var(--tg-cyan);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--tg-cyan);
        }

        /* 底部導航欄 - 採用 agent-home 的懸浮樣式 */
        .bottom-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 400px;
            height: 64px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--tg-cyan);
        }

        .nav-label { font-weight: 500; }

        /* 退出按鈕 */
        .btn-logout {
            height: 36px;
            padding: 0 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-white);
            border-radius: 18px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        .btn-logout:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="app-container" data-page="user-center">
        <!-- 頂部導航 -->
        <header class="safe-area-top px-5 py-4 flex items-center justify-between sticky top-0 z-50 bg-[#010204]/60 backdrop-blur-xl" data-section="header">
            <div class="flex items-center gap-2">
                <div class="text-white/40 font-medium text-xs border border-white/10 px-2 py-1 rounded">TGAI LOGO</div>
            </div>
            
            <div class="flex items-center gap-4 relative">
                <div class="flex items-center gap-1.5 text-white/90 font-medium">
                    <span class="text-sm">歡迎您，張三</span>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="opacity-40">
                        <path d="M18 15l-6-6-6 6"></path>
                    </svg>
                </div>
                <!-- 個人信息展開面板 -->
                <div class="absolute top-[calc(100%+12px)] right-0 w-48 neu-card p-4 z-[60] shadow-2xl shadow-cyan-500/10 border-cyan-500/20" data-section="user-dropdown-expanded">
                    <div class="space-y-3">
                        <div class="text-[13px] text-white/80 font-medium tracking-wide">138********23</div>
                        <div class="text-[13px] text-white/80">XXXXX有限公司</div>
                        <div class="pt-1">
                            <a href="#" class="text-[13px] text-cyan-500 font-bold hover:text-cyan-400 transition-colors flex items-center gap-1">
                                修改密碼
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 18l6-6-6-6"></path>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
                <button class="text-cyan-500 active:scale-95 ml-2">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 消息中心 -->
        <section class="px-5 py-4" data-section="message-center">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <h2 class="text-lg font-bold">消息中心 <span class="text-cyan-500 font-medium text-sm ml-1">(2條新消息)</span></h2>
                </div>
                <a href="#" class="text-cyan-500 text-xs flex items-center gap-0.5">
                    更多>
                </a>
            </div>
            
            <div class="neu-card p-5 space-y-4">
                <div class="flex items-start gap-2">
                    <div class="mt-2"><span class="dot-indicator"></span></div>
                    <div class="flex-1 text-[14px] text-white/80">
                        【系統通知】這是一條系統通知信息......
                    </div>
                </div>
                <div class="flex items-start gap-2">
                    <div class="mt-2"><span class="dot-indicator"></span></div>
                    <div class="flex-1 text-[14px] text-white/80">
                        【反饋信息】這是一條反饋信息......
                    </div>
                </div>
                <div class="flex items-start gap-2 pl-3.5">
                    <div class="flex-1 text-[14px] text-white/80">
                        【反饋信息】這是一條反饋信息......
                    </div>
                </div>
            </div>
        </section>

        <!-- 工作台 -->
        <section class="px-5 py-2" data-section="workbench">
            <h2 class="text-lg font-bold mb-4">工作台</h2>
            
            <!-- Agent 超市 -->
            <div class="neu-card p-6 mb-4 text-center">
                <h3 class="text-white/90 text-sm font-bold mb-6 text-left">Agent超市</h3>
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div>
                        <div class="stat-value">15<span class="stat-unit">個</span></div>
                        <div class="text-[11px] text-white/40 mt-1">已申請</div>
                    </div>
                    <div>
                        <div class="stat-value">5<span class="stat-unit">個</span></div>
                        <div class="text-[11px] text-white/40 mt-1">已收藏</div>
                    </div>
                    <div>
                        <div class="stat-value">3<span class="stat-unit">個</span></div>
                        <div class="text-[11px] text-white/40 mt-1">推薦使用</div>
                    </div>
                </div>
                <div class="text-[13px] text-white/60 mb-2">
                    您有 <span class="text-cyan-500 font-bold mx-0.5">3</span> 條申請審核中，請耐心等候！
                </div>
            </div>

            <!-- 收藏統計 -->
            <div class="neu-card p-6 flex items-center">
                <div class="flex-1 text-center border-r border-white/10">
                    <h3 class="text-white/90 text-sm font-bold mb-4">插件倉庫</h3>
                    <div class="stat-value">5<span class="stat-unit">個</span></div>
                    <div class="text-[11px] text-white/40 mt-1">已收藏</div>
                </div>
                <div class="flex-1 text-center">
                    <h3 class="text-white/90 text-sm font-bold mb-4">大模型</h3>
                    <div class="stat-value">5<span class="stat-unit">個</span></div>
                    <div class="text-[11px] text-white/40 mt-1">已收藏</div>
                </div>
            </div>
        </section>

        <!-- 底部導航欄 -->
        <nav class="bottom-nav" data-section="bottom-nav">
            <a href="agent-home-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A3 3 0 0015 5c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3zM6 12a3 3 0 100-6 3 3 0 000 6zm12 6a3 3 0 100-6 3 3 0 000 6z"></path>
                    <path d="M8.59 13.51l6.83 3.98m-.01-10.98l-6.82 3.98"></path>
                </svg>
                <span class="nav-label">Agent</span>
            </a>
            <a href="plugin-home-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 19.77a.44.44 0 00.38.65h18.47a.44.44 0 00.38-.65L12 2z"></path>
                    <path d="M12 9l-4 7h8l-4-7z"></path>
                </svg>
                <span class="nav-label">插件</span>
            </a>
            <a href="model-home-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span class="nav-label">模型</span>
            </a>
            <a href="news-home-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 3v3m0 12v3M5.64 5.64l2.12 2.12m8.48 8.48l2.12 2.12M3 12h3m12 0h3M5.64 18.36l2.12-2.12m8.48-8.48l2.12-2.12"></path>
                    <circle cx="12" cy="12" r="4"></circle>
                </svg>
                <span class="nav-label">快訊</span>
            </a>
            <a href="culture-home-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 7h16M4 12h16M4 17h16"></path>
                    <path d="M7 4v16M12 4v16M17 4v16" opacity="0.2"></path>
                </svg>
                <span class="nav-label">文化</span>
            </a>
        </nav>
    </div>
</body>
</html>
