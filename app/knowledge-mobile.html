<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>知識庫 - TGAI Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-white: rgba(255, 255, 255, 0.08);
            --tg-cyan: #00F2FF;
            --tg-emerald: #00F5A0;
            --tg-bg: #010204;
        }

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background: radial-gradient(circle at 50% 0%, #111827 0%, #010204 100%);
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background: transparent;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        .safe-area-top { padding-top: env(safe-area-inset-top); }

        /* 卡片樣式 */
        .neu-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 底部導航欄 */
        .bottom-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 400px;
            height: 64px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--tg-cyan);
        }

        .nav-label { font-weight: 500; font-size: 11px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
    <div class="app-container" data-page="knowledge-mobile">
        <!-- 頂部導航 -->
        <header class="safe-area-top px-5 py-4 flex items-center justify-between sticky top-0 z-50 bg-[#010204]/60 backdrop-blur-xl" data-section="header">
            <button onclick="window.history.back()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center border border-white/10 active:scale-90 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </button>
            <h1 class="text-lg font-bold tracking-tight">知識庫</h1>
            <div class="w-10"></div>
        </header>

        <!-- 主內容區：開發中卡片 -->
        <main class="flex-1 flex items-center justify-center px-6">
            <div class="w-full neu-card p-10 flex flex-col items-center text-center animate-fadeIn shadow-2xl shadow-cyan-500/5">
                <!-- 圖標區 -->
                <div class="w-20 h-20 rounded-2xl bg-[#0F172A] border border-white/10 flex items-center justify-center mb-8 shadow-inner">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 19.5C4 18.837 4.26339 18.2011 4.73223 17.7322C5.20107 17.2634 5.83696 17 6.5 17H20" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6.5 2H20V22H6.5C5.83696 22 5.20107 21.7366 4.73223 21.2678C4.26339 20.7989 4 20.163 4 19.5V4.5C4 3.83696 4.26339 3.20107 4.73223 2.73223C5.20107 2.26339 5.83696 2 6.5 2Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 7H16" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
                        <path d="M8 11H16" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
                    </svg>
                </div>

                <!-- 標題與描述 -->
                <h2 class="text-2xl font-bold text-white mb-4 tracking-tight">功能開發中</h2>
                <p class="text-[15px] text-white/50 mb-10 leading-relaxed px-4">智能知識庫系統即將上線，敬請期待</p>

                <!-- 功能清單 -->
                <div class="w-full space-y-4 px-2">
                    <div class="flex items-center gap-3 text-left">
                        <div class="w-5 h-5 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center shrink-0">
                            <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </div>
                        <span class="text-[15px] text-white/70 font-medium">文檔智能管理</span>
                    </div>
                    <div class="flex items-center gap-3 text-left">
                        <div class="w-5 h-5 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center shrink-0">
                            <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </div>
                        <span class="text-[15px] text-white/70 font-medium">語義檢索</span>
                    </div>
                    <div class="flex items-center gap-3 text-left">
                        <div class="w-5 h-5 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center shrink-0">
                            <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </div>
                        <span class="text-[15px] text-white/70 font-medium">知識圖譜</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- 底部導航欄 -->
        <nav class="bottom-nav">
            <a href="agent-home-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-label">首頁</span>
            </a>
            <a href="ai-reports-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                <span class="nav-label">報告</span>
            </a>
            <a href="user-center-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="nav-label">我的</span>
            </a>
        </nav>
    </div>
</body>
</html>
