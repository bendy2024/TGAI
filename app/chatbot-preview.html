<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TGAI Chatbot Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-cyan: #00F2FF;
            --tg-emerald: #00F5A0;
            --tg-bg: #0f172a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }

        .chatbot-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: 0 0 80px rgba(0,0,0,0.5);
        }

        .chatbot-header {
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .robot-eye-container {
            display: flex;
            gap: 4px;
        }

        .robot-eye {
            width: 6px;
            height: 6px;
            background: var(--tg-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--tg-cyan);
            animation: blink 4s infinite;
        }

        @keyframes blink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }

        .chatbot-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-col: column;
            gap: 16px;
        }

        .message-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 24px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
        }

        .message-bot {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .message-user {
            background: linear-gradient(135deg, var(--tg-cyan), var(--tg-emerald));
            color: #0f172a;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2);
        }

        .chatbot-input-area {
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 8px 8px 8px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(0, 242, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.05);
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--tg-cyan);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--tg-cyan), var(--tg-emerald));
            color: #0f172a;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 255, 0.4);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* 拍照界面樣式 */
        .camera-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 100;
            display: none; /* 默認隱藏，供 Figma 導入參考 */
            flex-direction: column;
        }

        .camera-view {
            flex: 1;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&q=80&w=1000') center/cover;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-scanner {
            width: 260px;
            height: 260px;
            border: 2px solid var(--tg-cyan);
            border-radius: 24px;
            position: relative;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }

        .camera-scanner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--tg-cyan);
            box-shadow: 0 0 15px var(--tg-cyan);
            animation: scan 3s infinite linear;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .camera-controls {
            padding: 40px 20px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid white;
            padding: 4px;
        }

        .shutter-inner {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
        }

        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="chatbot-container">
        <!-- Header -->
        <header class="chatbot-header">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center">
                    <div class="robot-eye-container">
                        <div class="robot-eye"></div>
                        <div class="robot-eye"></div>
                    </div>
                </div>
                <div>
                    <h3 class="text-white font-bold text-base font-orbitron tracking-tight">TGAI 智能助手</h3>
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                        <p class="text-[11px] text-emerald-400 font-medium">系統在線中</p>
                    </div>
                </div>
            </div>
            <button class="p-2 text-slate-500 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </header>

        <!-- Messages -->
        <div class="chatbot-messages no-scrollbar flex flex-col">
            <div class="message-bubble message-bot">
                您好！我是 TGAI 智能助手。我可以協助您查詢集團內部的 AI 模型、Agent 插件，或進行技術文檔檢索。
            </div>
            <div class="message-bubble message-bot">
                您可以嘗試輸入「模型列表」或「申請權限」。
            </div>
            <div class="message-bubble message-user">
                我想查詢關於 DeepSeek-V3 的接入指南，順便幫我上傳一份技術文檔。
            </div>
            <div class="message-bubble message-bot">
                沒問題，您可以點擊下方的 <span class="text-cyan-400">「+」</span> 按鈕選擇文檔，或者使用 <span class="text-cyan-400">「拍照」</span> 功能直接掃描紙質文檔。
            </div>
        </div>

        <!-- Input Area -->
        <div class="chatbot-input-area" data-section="chat-input">
            <div class="input-wrapper">
                <input type="text" placeholder="輸入訊息或指令..." class="bg-transparent border-none text-[15px] text-white focus:outline-none flex-1 placeholder:text-slate-500">
                
                <!-- 拍照或圖庫按鈕 -->
                <div class="action-btn" title="拍照或選擇圖庫" onclick="toggleCamera(true)">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </div>

                <!-- 上傳文檔按鈕 (回形針) -->
                <div class="action-btn" title="上傳文檔">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                    </svg>
                </div>

                <!-- 發送按鈕 -->
                <button class="send-btn">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 拍照界面 (隱藏，供 Figma 導入) -->
    <div class="camera-overlay" id="cameraOverlay" style="display: flex; opacity: 0; pointer-events: none; max-width: 440px; left: 50%; transform: translateX(-50%);">
        <div class="p-6 flex justify-between items-center">
            <button class="text-white" onclick="toggleCamera(false)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
            <span class="font-orbitron text-sm tracking-widest text-white/70">TGAI SCANNER</span>
            <div class="w-6"></div>
        </div>
        
        <div class="camera-view">
            <div class="camera-scanner"></div>
            <div class="absolute bottom-10 left-0 right-0 text-center px-4">
                <p class="text-white/60 text-xs tracking-widest uppercase">Align document within the frame or choose from gallery</p>
            </div>
        </div>

        <div class="camera-controls">
            <!-- 圖庫選擇預覽 -->
            <button class="w-12 h-12 rounded-lg bg-white/10 border border-white/20 overflow-hidden" title="從圖庫選擇">
                <img src="https://images.unsplash.com/photo-1542038784456-1ea8e935640e?auto=format&fit=crop&q=80&w=100" class="w-100 h-100 object-cover opacity-50" alt="Gallery">
            </button>
            
            <button class="shutter-btn">
                <div class="shutter-inner"></div>
            </button>
            
            <button class="text-white p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        function toggleCamera(show) {
            const camera = document.getElementById('cameraOverlay');
            if (show) {
                camera.style.display = 'flex';
                camera.style.opacity = '1';
                camera.style.pointerEvents = 'auto';
            } else {
                camera.style.display = 'none';
                camera.style.opacity = '0';
                camera.style.pointerEvents = 'none';
            }
        }
    </script>
</body>
</html>
