<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 報告 - TGAI Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-white: rgba(255, 255, 255, 0.08);
            --tg-cyan: #00F2FF;
            --tg-emerald: #00F5A0;
            --tg-bg: #010204;
        }

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background: radial-gradient(circle at 50% 0%, #111827 0%, #010204 100%);
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background: transparent;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        .safe-area-top { padding-top: env(safe-area-inset-top); }

        /* 卡片樣式 */
        .neu-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .neu-card:active {
            transform: scale(0.98);
            border-color: var(--tg-cyan);
        }

        /* 漸變按鈕 */
        .btn-action {
            height: 44px;
            background: linear-gradient(135deg, var(--tg-cyan) 0%, var(--tg-emerald) 100%);
            color: #000;
            font-weight: 700;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .btn-action:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        /* 玻璃按鈕 */
        .btn-glass {
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-white);
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .btn-glass:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }

        /* 底部導航欄 */
        .bottom-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 400px;
            height: 64px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--tg-cyan);
        }

        .nav-label { font-weight: 500; font-size: 11px; }

        /* 動畫 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeInUp 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="app-container" data-page="ai-reports-mobile">
        <!-- 頂部導航 -->
        <header class="safe-area-top px-5 py-4 flex items-center justify-between sticky top-0 z-50 bg-[#010204]/60 backdrop-blur-xl" data-section="header">
            <button onclick="window.history.back()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center border border-white/10 active:scale-90 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </button>
            <h1 class="text-lg font-bold tracking-tight">AI 報告</h1>
            <div class="w-10"></div> <!-- 佔位平衡佈局 -->

        <!-- 主內容區域 -->
        <main class="flex-1 px-5 py-6 space-y-6 overflow-y-auto no-scrollbar">
            <!-- 標題與更新狀態 -->

                    <div>
                        <h2 class="text-xl font-black text-white/90 tracking-widest uppercase">AI 報告更新</h2>

                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>

                                    2026-01-05

                                <span class="text-xs text-white/40 flex items-center gap-1">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                    2.4MB
                                </span>
                            </div>
                        </div>
                        <div class="text-cyan-500">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M9 18l6-6-6-6"></path>
                            </svg>
                        </div>
                    </div>
                </a>

                <a href="#" class="neu-card p-5 block active:scale-[0.98] transition-all">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex-1">
                            <h3 class="text-[16px] font-bold text-white mb-2 leading-snug">集團AI工作推動小組EMM月報 - 2025年10月</h3>
                            <div class="flex items-center gap-4">
                                <span class="text-xs text-white/40 flex items-center gap-1">

                                    1.8MB

                        <div class="text-white/20">

                                <path d="M9 18l6-6-6-6"></path>

                <a href="#" class="neu-card p-5 block active:scale-[0.98] transition-all">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex-1">
                            <h3 class="text-[16px] font-bold text-white mb-2 leading-snug">集團AI工作推動小組EMM月報 - 2025年9月</h3>
                            <div class="flex items-center gap-4">
                                <span class="text-xs text-white/40 flex items-center gap-1">

                                    2025-10-05
                                </span>
                                <span class="text-xs text-white/40 flex items-center gap-1">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

                        <div class="text-white/20">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M9 18l6-6-6-6"></path>
                            </svg>
                        </div>
                    </div>
                </a>
            </section>

            <!-- 底部操作提示 -->
            <div class="pt-4 pb-10 animate-fade-in" style="animation-delay: 0.3s;">
                <div class="grid grid-cols-1 gap-3">
                    <button class="btn-glass w-full" onclick="window.history.back()">返回上一頁</button>
                </div>
            </div>
        </main>

        <!-- 底部導航欄 -->
        <nav class="bottom-nav">
            <a href="agent-home-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>

            </a>
            <a href="#" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span class="nav-label">報告</span>
            </a>
            <a href="user-center-mobile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>

        </nav>
    </div>
</body>
</html>
