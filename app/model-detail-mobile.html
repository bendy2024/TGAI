<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>模型詳情 - TGAI Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-white: rgba(255, 255, 255, 0.1);
            --tg-cyan: #00F2FF;
            --tg-emerald: #00F5A0;
            --tg-bg: #010204;
            --card-radius: 24px;
        }

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background: radial-gradient(circle at 50% 0%, #111827 0%, #010204 100%);
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background-color: #010204;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
            overflow-x: hidden;
            padding-bottom: 100px; /* Space for bottom bar */
        }

        .safe-area-top { padding-top: calc(env(safe-area-inset-top) + 12px); }
        
        /* 磨砂玻璃效果 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .neu-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
        }

        /* 標籤樣式 */
        .tag-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-white);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        /* 按鈕樣式 */
        .btn-action {
            background: linear-gradient(135deg, var(--tg-emerald) 0%, var(--tg-cyan) 100%);
            color: #000;
            font-weight: 700;
            border-radius: 12px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 245, 160, 0.2);
            width: 100%;
            font-size: 15px;
        }
        .btn-action:active { transform: scale(0.95); opacity: 0.9; }

        .feedback-link {
            color: var(--tg-cyan);
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .feedback-link:active { opacity: 0.7; }

        /* 底部固定欄 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 440px;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--tg-bg) 80%, transparent);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }

        .description-text {
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="app-container" data-page="model-detail">
        <!-- 頂部導航 -->
        <header class="safe-area-top px-5 py-4 flex items-center justify-between sticky top-0 z-50" data-section="header">
            <a href="model-home-mobile.html" class="w-11 h-11 flex items-center justify-center rounded-full bg-white/5 active:bg-white/10 shrink-0">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </a>
            <div class="flex-1 flex justify-center">
                <span class="text-xs font-bold tracking-[0.2em] text-white/40 uppercase">模型詳情</span>
            </div>
            <button class="w-11 h-11 flex items-center justify-center rounded-full bg-white/5 active:bg-white/10 shrink-0">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                </svg>
            </button>
        </header>

        <!-- 模型核心信息 -->
        <section class="px-5 pt-6 pb-8" data-section="model-hero">
            <div class="neu-card p-6 mb-8">
                <div class="flex items-center gap-5 mb-6">
                    <div class="w-20 h-20 rounded-[24px] bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center shrink-0 shadow-lg shadow-emerald-500/5">
                        <svg class="w-12 h-12 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-white leading-tight">通義千問3</h1>
                        <p class="text-white/40 text-sm mt-1">文本生成大模型</p>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex items-center justify-between text-white/50 py-2 border-b border-white/5">
                        <span class="text-sm">來源</span>
                        <span class="text-sm text-white font-medium">阿裏雲百煉</span>
                    </div>
                    <div class="flex items-center justify-between text-white/50 py-2">
                        <span class="text-sm">創建時間</span>
                        <span class="text-sm text-white font-medium">2025/01/12</span>
                    </div>
                </div>
            </div>

            <!-- 標籤列表 -->
            <div class="flex flex-wrap gap-3" data-section="tags">
                <span class="tag-pill">城市燃氣</span>
                <span class="tag-pill">視頻工具</span>
                <span class="tag-pill">對話式交互</span>
            </div>
        </section>

        <!-- 模型描述 -->
        <section class="px-5 pb-12" data-section="model-description">
            <div class="neu-card p-6">
                <h3 class="text-white font-bold mb-4 flex items-center gap-2">
                    <div class="w-1 h-4 bg-emerald-500 rounded-full"></div>
                    模型詳情
                </h3>
                <div class="description-text space-y-6">
                    <p>
                        大模型，全稱大型語言模型 (Large Language Model, LLM)，其概念現已拓展至多模態領域，是人工智能領域的核心技術成果，指通過大規模參數與海量數據訓練構建而成的深度學習模型，憑藉強大的信息處理與智能生成能力，正深刻重構各行業的運行模式。
                    </p>
                    <p>
                        這類模型通常具備數億至數千億級別的參數規模，訓練數據量可達TB級，涵蓋文本、圖像、音頻等多種數據類型，突破了傳統模型的能力邊界。
                    </p>
                </div>
            </div>
        </section>

        <!-- 底部操作欄 -->
        <div class="bottom-bar glass-panel" data-section="actions">
            <div class="flex-1">
                <button class="btn-action">馬上使用</button>
            </div>
            <a href="#" class="feedback-link shrink-0">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </a>
        </div>
    </div>
</body>
</html>
