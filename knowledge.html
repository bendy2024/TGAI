<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <title>TGAI | 知識庫</title>

<body class="bg-[#020406] text-white font-['Noto_Sans_TC']">
    <div class="ambient-glow"></div>
    <div class="grid-matrix"></div>

    <!-- HUD 狀態欄 -->
    <div class="w-full h-10 border-b border-white/5 flex items-center justify-between px-12 text-[14px] tracking-widest font-mono-code bg-[#020406] relative z-[110]">
        <div class="flex items-center gap-10">
            <div class="flex items-center gap-2.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 status-live"></span>
                <span class="text-slate-200 uppercase">系統狀態: 在線 / 2026.03.06</span>
            </div>
            <div class="hidden md:flex items-center gap-2.5">
                <span class="text-slate-200">運算集群負載:</span>
                <span class="text-cyan-400">68%</span>
            </div>
        </div>
        <div class="flex items-center gap-8">
            <span class="text-slate-200 uppercase hidden sm:inline">Region: HK / Shenzhen</span>
            <span class="text-cyan-400 uppercase">API 延遲: 38ms</span>
        </div>

    <!-- 導航欄 -->

                <div class="w-11 h-11 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/20 bg-white/5 border border-white/10">
                    <img src="assets/images/logo.png" alt="Towngas Logo" class="w-10 h-10 object-contain">
                </div>
                <div class="leading-none">
                    <h1 class="text-3xl font-black tracking-tighter uppercase leading-none bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-emerald-400">
                        TGAI
                    </h1>
                </div>
            </div>
            
            <div class="hidden lg:flex items-center gap-10 text-lg font-bold uppercase tracking-wider text-white">
                <a href="index.html" class="nav-link">首頁</a>
                <a href="agent-market.html" class="nav-link">Agent超市</a>
                <a href="plugins.html" class="nav-link">插件倉庫</a>
                <a href="knowledge.html" class="nav-link active">知識庫</a>
                <a href="models.html" class="nav-link">模型管理</a>
                <a href="#" class="nav-link">AI 報告</a>
                <a href="ainews.html" class="nav-link">AI 快訊</a>
                <a href="culture.html" class="nav-link">AI文化</a>
            </div>

            <div class="flex items-center gap-5">
                <div class="language-switcher flex items-center bg-white/5 rounded-full px-3 py-2 gap-2 border border-white/10 cursor-pointer hover:border-emerald-500/30 transition-all group">
                    <div class="language-icon traditional active w-5 h-5 relative flex items-center justify-center transition-all duration-300 group-hover:scale-110">
                        <span class="text-slate-200 text-[10px] font-bold">繁</span>
                    </div>
                    <svg class="w-3 h-3 text-slate-200 transition-transform duration-300 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </div>
            </div>
        </nav>
    </header>

    <!-- 主內容區：僅包含紅框內容 -->
    <main class="min-h-[calc(100vh-112px)] flex items-center justify-center p-12 relative z-10">
        <div class="w-[480px] neu-card p-12 flex flex-col items-center text-center animate-fadeIn">
            <!-- 圖標區 -->
            <div class="w-24 h-24 rounded-3xl bg-[#0F172A] border border-white/10 flex items-center justify-center mb-10 shadow-inner">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                    <path d="M8 7H16" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

            <!-- 功能列表 -->
            <div class="w-full space-y-5 px-4">
                <div class="flex items-center gap-4 text-left">
                    <div class="w-6 h-6 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center shrink-0">
                        <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </div>
                    <span class="text-lg text-slate-300 font-medium">文檔智能管理</span>
                </div>
                <div class="flex items-center gap-4 text-left">
                    <div class="w-6 h-6 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center shrink-0">
                        <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </div>
                    <span class="text-lg text-slate-300 font-medium">語義檢索</span>
                </div>
                <div class="flex items-center gap-4 text-left">
                    <div class="w-6 h-6 rounded-full bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center shrink-0">
                        <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </div>
                    <span class="text-lg text-slate-300 font-medium">知識圖譜</span>
                </div>
            </div>
        </div>
    </main>

    <style>
        .nav-link.active {
            color: #00F2FF !important;
            position: relative;
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -22px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #00F2FF, #00F5A0);
            box-shadow: 0 0 10px #00F2FF;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</body>
</html>
