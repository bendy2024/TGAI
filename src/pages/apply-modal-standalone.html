<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申請使用彈窗組件 | TGAI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background: #020406; /* 與主頁背景色一致 */
            margin: 0;
            padding: 0;
        }

        /* 模擬主頁的環境光與網格背景，確保導入 Figma 時視覺效果一致 */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .grid-matrix {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* 彈窗專屬動畫 */
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-animate {
            animation: modalFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <!-- 背景裝飾 -->
    <div class="ambient-glow"></div>
    <div class="grid-matrix"></div>

    <!-- 背景遮罩 (Overlay) -->
    <div class="fixed inset-0 bg-black/80 backdrop-blur-md"></div>
    
    <!-- 彈窗主體 (Standalone Modal) -->
    <div class="relative bg-[#0f172a]/90 backdrop-blur-2xl w-full max-w-2xl rounded-[32px] shadow-2xl overflow-hidden border border-white/10 modal-animate">
        <!-- 標題欄 -->
        <div class="px-10 py-8 border-b border-white/10 flex items-center justify-between">
            <h3 class="text-2xl font-bold text-white tracking-tight">申請使用</h3>
            <button class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- 表單內容 -->
        <div class="px-10 py-10">
            <!-- 用戶資訊卡片區 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10 text-sm">
                <div class="space-y-2">
                    <p class="text-slate-500 font-medium uppercase tracking-wider text-[11px]">申請人</p>
                    <p class="font-bold text-slate-100 text-base">張三</p>
                </div>
                <div class="space-y-2">
                    <p class="text-slate-500 font-medium uppercase tracking-wider text-[11px]">聯繫電話</p>
                    <p class="font-bold text-slate-100 text-base">138XXXXXX</p>
                </div>
                <div class="space-y-2">
                    <p class="text-slate-500 font-medium uppercase tracking-wider text-[11px]">所屬企業</p>
                    <p class="font-bold text-slate-100 text-base">XXXXXXX公司</p>
                </div>
            </div>
            
            <!-- 輸入區域 -->
            <div class="space-y-4">
                <label class="block text-sm font-bold text-slate-200 tracking-wide">
                    <span class="text-orange-500 mr-1">*</span>申請理由
                </label>
                <textarea 
                    rows="6" 
                    class="w-full px-6 py-4 rounded-2xl bg-white/5 border border-white/10 focus:border-orange-500/50 focus:ring-4 focus:ring-orange-500/10 outline-none transition-all text-slate-100 placeholder:text-slate-500 text-base resize-none"
                    placeholder="請輸入您申請使用該模型的具體原因及應用場景..."
                ></textarea>
            </div>
        </div>
        
        <!-- 按鈕區 (CTA) -->
        <div class="px-10 py-8 border-t border-white/5 flex justify-end gap-4 bg-white/2">
            <button class="px-8 py-3 rounded-xl font-bold text-slate-300 hover:text-white hover:bg-white/10 transition-all bg-white/5 border border-white/10">
                取消
            </button>
            <button class="px-10 py-3 rounded-xl font-bold text-white bg-orange-500 hover:bg-orange-400 transition-all shadow-lg shadow-orange-500/30">
                提交申請
            </button>
        </div>
    </div>
</body>
</html>
