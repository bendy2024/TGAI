<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <include src="components/head-common.html"></include>
    <title>登錄 | TGAI - 中華煤氣統一 AI 平台</title>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tg-cyan': '#00F2FF',
                        'tg-emerald': '#00F5A0',
                        'bg-deep': '#020406',
                        'bg-surface': '#080C12',
                    }
                }
            }
        }
    </script>
    <style>
        /* 確保字體全局統一 */
        * {
            font-family: 'Noto Sans TC', sans-serif !important;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 登錄頁專屬背景調整 */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.08) 0%, rgba(0, 245, 160, 0.05) 50%, transparent 100%);
            z-index: -1;
            filter: blur(80px);
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 2rem;
            z-index: 10;
        }

        /* 輸入框自定義樣式 */
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-white);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            font-size: 14px;
        }

        .input-field:focus {
            border-color: var(--tg-cyan);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1);
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .input-field:focus + .input-label {
            color: var(--tg-cyan);
        }

        /* 密碼切換按鈕 */
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 38px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--tg-cyan);
        }

        /* 錯誤訊息樣式 */
        .error-message {
            color: #ff4d4f;
            font-size: 12px;
            margin-top: 4px;
            display: none;
            align-items: center;
            gap: 4px;
        }

        /* 複選框自定義 */
        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            height: 18px;
            width: 18px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-white);
            border-radius: 4px;
            margin-right: 10px;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-container:hover input ~ .checkmark {
            border-color: var(--tg-cyan);
        }

        .checkbox-container input:checked ~ .checkmark {
            background-color: var(--tg-cyan);
            border-color: var(--tg-cyan);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid black;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }
    </style>
</head>
<body>
    <!-- 背景裝飾 -->
    <div class="ambient-glow"></div>
    <div class="grid-matrix"></div>

    <div class="login-container">
        <div class="neu-card p-10 relative overflow-hidden">
            <!-- 頂部裝飾條 -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-tg-cyan to-tg-emerald opacity-50"></div>
            
            <!-- Logo & 標題 -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 mb-6 group transition-all duration-500 hover:border-cyan-400/50 hover:bg-cyan-500/20">
                    <svg class="w-8 h-8 text-tg-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white mb-2">中華煤氣統一 AI 平台</h1>
                <p class="text-[13px] text-slate-200">請使用您的 Towngas 帳戶登錄</p>
            </div>

            <!-- 登錄表單 -->
            <form id="loginForm" novalidate>
                <!-- 用戶名/郵件 -->
                <div class="input-group">
                    <label for="account" class="input-label">用戶名或電子郵件</label>
                    <input type="text" id="account" name="account" class="input-field" placeholder="請輸入帳號" required autocomplete="username" aria-describedby="accountError">
                    <div id="accountError" class="error-message" role="alert">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        <span>請輸入正確的用戶名或郵件</span>
                    </div>
                </div>

                <!-- 密碼 -->
                <div class="input-group">
                    <label for="password" class="input-label">密碼</label>
                    <input type="password" id="password" name="password" class="input-field" placeholder="請輸入密碼" required autocomplete="current-password" aria-describedby="passwordError">
                    <button type="button" id="passwordToggle" class="password-toggle" aria-label="切換密碼顯示" title="切換密碼顯示">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                    <div id="passwordError" class="error-message" role="alert">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        <span>密碼長度至少需 8 位</span>
                    </div>
                </div>

                <!-- 記住我 & 忘記密碼 -->
                <div class="flex items-center justify-between mb-8">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        記住登錄狀態
                    </label>
                    <a href="#" class="text-[13px] font-medium text-tg-cyan hover:text-tg-emerald transition-colors">忘記密碼？</a>
                </div>

                <!-- 登錄按鈕 -->
                <button type="submit" id="submitBtn" class="btn-action w-full py-3.5 rounded-xl text-sm font-bold tracking-wider mb-6 flex items-center justify-center gap-2 group">
                    <span>立即登錄</span>
                    <svg class="w-4 h-4 transform transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                    </svg>
                </button>

                <!-- 註冊提示 -->
                <p class="text-center text-[13px] text-slate-400">
                    還沒有帳號？ <a href="#" class="text-tg-cyan hover:underline decoration-tg-cyan/30 underline-offset-4 font-medium">聯繫管理員申請</a>
                </p>
            </form>
        </div>

        <!-- 底部輔助連結 -->
        <div class="mt-8 flex justify-center gap-6 text-[13px] font-bold tracking-widest text-slate-600 uppercase">
            <a href="#" class="hover:text-slate-200 transition-colors">隱私政策</a>
            <span class="opacity-20">|</span>
            <a href="#" class="hover:text-slate-200 transition-colors">服務條款</a>
            <span class="opacity-20">|</span>
            <a href="#" class="hover:text-slate-200 transition-colors">幫助中心</a>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const passwordField = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            const eyeIcon = document.getElementById('eyeIcon');
            const accountField = document.getElementById('account');
            const submitBtn = document.getElementById('submitBtn');

            // 密碼顯示/隱藏切換
            passwordToggle.addEventListener('click', () => {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                
                // 更新圖標
                if (type === 'text') {
                    eyeIcon.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
                    `;
                } else {
                    eyeIcon.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    `;
                }
            });

            // 表單驗證
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                let isValid = true;

                // 帳號驗證
                if (accountField.value.trim().length < 3) {
                    document.getElementById('accountError').style.display = 'flex';
                    accountField.style.borderColor = '#ff4d4f';
                    isValid = false;
                } else {
                    document.getElementById('accountError').style.display = 'none';
                    accountField.style.borderColor = 'var(--border-white)';
                }

                // 密碼驗證
                if (passwordField.value.length < 8) {
                    document.getElementById('passwordError').style.display = 'flex';
                    passwordField.style.borderColor = '#ff4d4f';
                    isValid = false;
                } else {
                    document.getElementById('passwordError').style.display = 'none';
                    passwordField.style.borderColor = 'var(--border-white)';
                }

                if (isValid) {
                    // 模擬登錄動畫
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = `
                        <svg class="animate-spin h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>登錄中...</span>
                    `;
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            });

            // 輸入時清除錯誤狀態
            [accountField, passwordField].forEach(field => {
                field.addEventListener('input', () => {
                    field.style.borderColor = 'var(--tg-cyan)';
                    const errorId = field.id + 'Error';
                    document.getElementById(errorId).style.display = 'none';
                });
                
                field.addEventListener('blur', () => {
                    field.style.borderColor = 'var(--border-white)';
                });
            });
        });
    </script>
</body>
</html>
